version: '3.8'

services:
  # -------------------------------------------------------------
  # 1. PostgreSQL Database with JSONB GIN Indexing Support
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: easystore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-madhavi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Madhavi123}
      POSTGRES_DB: ${POSTGRES_DB:-artesca_metadata}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-madhavi} -d ${POSTGRES_DB:-artesca_metadata}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # 2. S3-Compatible Object Storage (MinIO for Local Dev)
  # When deploying against real Scality ARTESCA, set S3_ENDPOINT_URL
  # in .env to your ARTESCA endpoint and comment out minio/minio-init.
  # -------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: easystore-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # 3. MinIO Provisioner (Bucket Initialization)
  # Automatically creates target bucket 'artesca-documents' on boot
  # -------------------------------------------------------------
  minio-init:
    image: minio/mc:latest
    container_name: easystore-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 ${S3_ACCESS_KEY_ID:-minioadmin} ${S3_SECRET_ACCESS_KEY:-minioadmin};
      /usr/bin/mc mb myminio/${S3_BUCKET:-artesca-documents} --ignore-existing;
      echo 'MinIO bucket initialized successfully.';
      exit 0;
      "

  # -------------------------------------------------------------
  # 4. Backend Service (FastAPI + SQLAlchemy + Boto3)
  # -------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: easystore-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-madhavi}:${POSTGRES_PASSWORD:-Madhavi123}@postgres:5432/${POSTGRES_DB:-artesca_metadata}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-artesca-documents}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_USE_SSL: ${S3_USE_SSL:-false}
      S3_VERIFY_SSL: ${S3_VERIFY_SSL:-false}
      S3_ADDRESSING_STYLE: path
      SECRET_KEY: ${SECRET_KEY:-artesca-production-secret-replace-with-openssl-rand-hex-32}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-120}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # -------------------------------------------------------------
  # 5. Frontend Service (React 19 + TypeScript + Nginx)
  # -------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: easystore-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  minio_data:
